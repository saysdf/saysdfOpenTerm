[package]
name = "saysdf-cli"
version = "0.1.0"
edition = "2021"
publish = false
description = "saysdfTerm: saysdf TUI tools binary (view, …)"

[[bin]]
name = "saysdf"
path = "src/main.rs"

[dependencies]
saysdf-render = {path="../render"}
saysdf-secrets = {path="../secrets"}
saysdf-db = {path="../db"}
saysdf-identity = {path="../identity"}
saysdf-keys = {path="../keys"}
saysdf-hints = {path="../hints"}
saysdf-i18n = {path="../i18n"}
wezterm-input-types.workspace = true
ratatui = {workspace=true, features=["crossterm"]}
clap.workspace = true
notify.workspace = true
serde_json.workspace = true
sysinfo = {version="0.37", default-features=false, features=["system", "disk", "network"]}
csv = "1"
serde.workspace = true
toml.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = {workspace=true, features=["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"]}

[dev-dependencies]
tempfile.workspace = true
# saysdf_i18n::testing: tests look up in English (or the language of use_lang), per thread
saysdf-i18n = {path="../i18n", features=["testing"]}
