# Russian catalog of the saysdf-render Mermaid preview (saysdf/render/src/mermaid).

# Note above the diagram source when it cannot be drawn; {why} is one of the reasons below
"mermaid: {why} — source" = "mermaid: {why} — исходник"
"empty diagram" = "пустая диаграмма"
# {kind} is the diagram type from the first line, e.g. gantt
"{kind} type is not supported yet" = "вид `{kind}` не поддерживается"
# {line} is a line number, {msg} a parse error from the list below
"line {line}: {msg}" = "строка {line}: {msg}"
"diagram too large ({n} nodes, limit {max})" = "слишком большая диаграмма ({n} узлов, лимит {max})"

# Flowchart parse errors, shown after "line N:"; {close} is a closing bracket, {text} source text
"unclosed quote" = "незакрытая кавычка"
"expected `{close}`" = "ожидалось `{close}`"
"unclosed `|label|`" = "незакрытая `|подпись|`"
"expected a node id: `{text}`" = "ожидался id узла: `{text}`"
"edge without a target node" = "ребро без целевого узла"
"unrecognized text: `{text}`" = "непонятный текст: `{text}`"
"expected a `flowchart`/`graph` header" = "ожидался заголовок `flowchart`/`graph`"
"subgraph nesting is deeper than {max}" = "вложенность subgraph больше {max}"
"`end` without `subgraph`" = "`end` без `subgraph`"
"unclosed `subgraph`" = "незакрытый `subgraph`"

# Sequence diagram parse errors, shown after "line N:"; code in backticks stays as is
"expected a `sequenceDiagram` header" = "ожидался заголовок `sequenceDiagram`"
"participant without a name" = "участник без имени"
"`end` without an open block" = "`end` без открытого блока"
"`else` outside a block" = "`else` вне блока"
"Note without `:`" = "Note без `:`"
"Note: expected left of / right of / over" = "Note: ожидалось left of / right of / over"
"Note: one or two participants" = "Note: один или два участника"
"unrecognized line" = "непонятная строка"
"message: expected `A->>B: text`" = "сообщение: ожидалось `A->>B: текст`"
"unclosed block (no `end`)" = "незакрытый блок (нет `end`)"
