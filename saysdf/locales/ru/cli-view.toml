# Russian catalog of `saysdf view`, `saysdf md` and `saysdf mermaid`
# (saysdf/cli/src/cmd/view.rs, md.rs, mermaid.rs).

# ---- Shared: opening a file ----
"this is a folder, not a file" = "это папка, а не файл"
"file not found" = "файл не найден"
"no permission to read" = "нет прав на чтение"
"the file is larger than 16 MiB" = "файл больше 16 МиБ"
# `saysdf view` is a command name, keep it.
"the file is larger than 16 MiB, open it with `saysdf view`" = "файл больше 16 МиБ — откройте через `saysdf view`"

# ---- Status line (shown until the next key press) ----
"reloaded" = "перечитано"
# {status} is the viewer status (syntax name, zoom, ...).
"reloaded; {status}" = "перечитано; {status}"
# {error} is the system error text.
"read error: {error}" = "ошибка чтения: {error}"
"binary file: hex view" = "бинарный файл: hex-вид"
"large file: no highlighting or search" = "большой файл: без подсветки и поиска"
"error" = "ошибка"
# Last line of the error screen; the key stays as it is.
"q to quit" = "q — выход"

# ---- Markdown preview ----
"Tab to select a link" = "Tab — выбрать ссылку"
# {anchor} is the part of a link after #.
"no heading #{anchor}" = "нет заголовка #{anchor}"
# {url} is a link target; external links are only shown.
"link (not opened): {url}" = "ссылка (не открывается): {url}"
"history is empty" = "история пуста"
"last heading" = "последний заголовок"
"first heading" = "первый заголовок"
# {i}/{n} is the link number and the link count.
"link {i}/{n}: {url}  (Enter to open)" = "ссылка {i}/{n}: {url}  (Enter — открыть)"
"no links" = "ссылок нет"
# {name} is the zoom level: compact, normal or spacious.
"mermaid zoom: {name}" = "зум mermaid: {name}"
"images: captions only (terminal without OSC 1337)" = "картинки: только подписи (терминал без OSC 1337)"

# ---- Mermaid preview ----
# {name} is the zoom level: compact, normal or spacious.
"zoom: {name} (+/- , z to reset)" = "зум: {name} (+/- , z — сброс)"
"zoom: {name} (limit)" = "зум: {name} (предел)"
# Command line error for --zoom.
"expected compact, normal or spacious" = "ожидалось compact, normal или spacious"

# ---- Command line messages ----
"saysdf view: stdout is not a terminal" = "saysdf view: stdout не терминал"
"saysdf view: terminal: {error}" = "saysdf view: терминал: {error}"
"saysdf md: stdout is not a terminal" = "saysdf md: stdout не терминал"
"saysdf md: terminal: {error}" = "saysdf md: терминал: {error}"
"saysdf help: terminal: {error}" = "saysdf help: терминал: {error}"
"saysdf mermaid: terminal: {error}" = "saysdf mermaid: терминал: {error}"

# ---- Keyboard selection (text-annotations) ----
"soft wrap on" = "перенос строк включён"
"soft wrap off" = "перенос строк выключен"
"selection is unavailable: the file is shown read-only" = "выделение недоступно: файл открыт только для чтения"
"nothing to select" = "нечего выделять"

# ---- Annotation actions (text-annotations) ----
# {markup} is the CriticMarkup that will be written, e.g. {++text++}.
"mark the selection as deleted ({markup})?" = "пометить выделенное как удалённое ({markup})?"
"replace the selection with ({markup}):" = "заменить выделенное на ({markup}):"
"insert text ({markup}):" = "вставить текст ({markup}):"
"comment at the caret ({markup}):" = "комментарий в точке каретки ({markup}):"
"comment on the selection ({markup}):" = "комментарий к выделенному ({markup}):"
"annotation written" = "аннотация записана"
"annotation cancelled" = "аннотация отменена"

# ---- Annotation navigation, amend and remove (text-annotations) ----
"annotations: {n}" = "аннотаций: {n}"
"annotations: {k}/{n}" = "аннотация {k}/{n}"
"no annotations" = "аннотаций нет"
"no more annotations" = "больше аннотаций нет"
"no annotation under the caret" = "под кареткой нет аннотации"
"remove the annotation under the caret?" = "убрать аннотацию под кареткой?"
"amend the annotation text:" = "изменить текст аннотации:"
"annotation removed" = "аннотация убрана"

# ---- Key hint line (text-annotations D13) ----
# Labels after a key: "Shift+arrows select · Alt+↓/↑ annotations · Ctrl: R substitute · D delete · Esc cancel".
"Shift+arrows" = "Shift+стрелки"
"select" = "выделить"
"annotations" = "аннотации"
"wrap" = "перенос"
"substitute" = "заменить"
"delete" = "удалить"
"insert" = "вставить"
"comment" = "комментарий"
"amend" = "изменить"
"remove" = "убрать"
"write" = "записать"
"cancel" = "отмена"
"nothing selected: Shift+arrows or Ctrl+Space" = "ничего не выделено: Shift+стрелки или Ctrl+Space"

# ---- Diff against HEAD (text-annotations D13, Ctrl+F) ----
"diff" = "diff"

# ---- Annotation list (text-annotations D13, Ctrl+L) ----
"list" = "список"
"annotations: {error}" = "аннотации: {error}"
"not a git repository: no diff against HEAD" = "не git-репозиторий: сравнить с HEAD нельзя"
"the file is not tracked by git: no diff against HEAD" = "файл не отслеживается git: сравнить с HEAD нельзя"
"diff: {error}" = "diff: {error}"
"terminal: {error}" = "терминал: {error}"

# ---- Hand-off to the agent (text-annotations D7, Ctrl+G) ----
"agent" = "агент"
"open the viewer from saysdfTerm to hand off" = "откройте просмотрщик из saysdfTerm, чтобы передать агенту"
"the path contains control or invisible characters" = "в пути есть управляющие или невидимые символы"
"handed to the agent" = "передано агенту"
