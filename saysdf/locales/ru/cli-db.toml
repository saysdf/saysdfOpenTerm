# Russian catalog of `saysdf db` (saysdf/cli/src/db/*.rs).

# ---- Dangerous (write) mode. Safety-critical: keep the wording and the database name. ----

# Dialog title and banner label; shown in capitals on a red background.
"DANGEROUS MODE" = "ОПАСНЫЙ РЕЖИМ"
# Confirmation dialog; {db} is the database name the user has to type.
"Queries will be able to modify data in “{db}”.\nTo enable, type the database name and press Enter (Esc to cancel)." = "Запросы смогут изменять данные в «{db}».\nДля включения введите имя базы и нажмите Enter (Esc — отмена)."
# Toolbar buttons. Keep them short: the button is clickable and drawn in one line.
"[ Allow writes… ]" = "[ Разрешить запись… ]"
"[ Leave dangerous mode ]" = "[ Выйти из опасного режима ]"
# Reason recorded with the write grant; shown after the banner text.
"enabled by the toolbar button" = "включено кнопкой тулбара"
"database name does not match — writes not enabled" = "имя базы не совпало — запись не включена"
"reconnecting with write access…" = "переподключение с правом записи…"
"connected: WRITES ALLOWED" = "подключено: ЗАПИСЬ РАЗРЕШЕНА"
# Toolbar access indicator (upper case, red).
"WRITE" = "ЗАПИСЬ"
"read-only" = "read-only"
"connecting (read-only)…" = "подключение (read-only)…"
"connected (read-only)" = "подключено (read-only)"

